name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported and latest Spring Boot version
        boot: ['4.0.8', '4.1.1']
    defaults:
      run:
        working-directory: common-exception-handler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -PbootVersion=${{ matrix.boot }}
